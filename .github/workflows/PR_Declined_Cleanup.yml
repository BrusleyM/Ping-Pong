name: PR Build Cleanup

# Delete a PR's APK artifact once the PR is closed (merged or not).
on:
  pull_request:
    types: [closed]
    branches: [main, develop]

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      # Artifacts belong to the build run, so delete them through the API by name.
      - name: Delete PR build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: Unity-Build-PR-${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${NAME}" --jq '.artifacts[].id' |
            while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"; echo "Deleted ${id}"; done
