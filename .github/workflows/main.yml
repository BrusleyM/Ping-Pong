name: Unity VR Android Build and Upload

# Release build: push a commit (or merge a PR whose title) contains [Develop], [Staging] or [Production].
#   The matching BuildScript method moves the version in ProjectSettings (x.y.z: Develop bumps z,
#   Staging bumps y and resets z, Production bumps x and resets y and z; every build bumps the bundle
#   code), builds, uploads to Meta ALPHA, tags vX.Y.Z, and commits ProjectSettings back to the pushed
#   branch ([skip ci]). The version is the same file locally and in CI: no second source.
#   Only develop and main release; a keyword pushed to any other branch does nothing. Release runs go
#   one at a time (one workflow-level queue), build the branch's latest commit, and the bundle code is always above every code
#   already released (read from the release tags), so Meta never sees a duplicate. The version is
#   committed back and tagged before the upload: a failed upload only leaves a gap in the codes.
#   Merge PRs with a merge commit (not squash), so [skip ci] lines and old keywords don't carry over.
#   Local Build > Develop/Staging/Production also moves the version: commit ProjectSettings after it.
# main push without a keyword: promote the ALPHA build to BETA, tag vX.Y.Z-beta (no rebuild). The tag
#   uses main's version, which matches the ALPHA build once develop's version commit is merged to main.
# PR: check build (compiles, tests, signs) without touching the version.

on:
  push:
    paths-ignore: ['**.md', '.github/workflows/PR_Declined_Cleanup.yml']
  pull_request:
    branches: [main, develop]
    paths-ignore: ['**.md']

# develop/main pushes (releases and promotions) form one queue: a whole run finishes, version commit and
# tag included, before the next starts. GitHub keeps one *pending* run per group, so a third quick push
# replaces a second that hasn't started. Superseded PR checks are cancelled.
concurrency:
  group: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && 'release' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.kind.outputs.kind }}
    steps:
      - name: Work out what this run does
        id: kind
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then kind=Check
          else
            kind=$(printf '%s' "$MESSAGE" | grep -oiE '\[(develop|staging|production)\]' | head -1 | tr -d '[]' | tr '[:upper:]' '[:lower:]')
            case "$kind" in
              develop) kind=Develop ;; staging) kind=Staging ;; production) kind=Production ;;
              *) if [ "$REF" = "refs/heads/main" ]; then kind=Promote; else kind=None; fi ;;
            esac
            case "$kind" in Develop|Staging|Production)
              if [ "$REF" != "refs/heads/develop" ] && [ "$REF" != "refs/heads/main" ]; then
                echo "::notice::$kind keyword ignored: only develop and main release."
                kind=None
              fi ;;
            esac
          fi
          echo "This run: $kind"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

  build:
    name: Build Unity Android
    needs: plan
    if: needs.plan.outputs.kind != 'None' && needs.plan.outputs.kind != 'Promote'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write   # unity-test-runner publishes the test results as a check
    outputs:
      version: ${{ steps.built.outputs.version }}
      code: ${{ steps.built.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          # A release builds the branch's latest commit, which includes the previous release's version commit.
          ref: ${{ needs.plan.outputs.kind != 'Check' && github.ref_name || '' }}

      - name: Highest code already released
        id: released
        run: |
          git fetch --tags --quiet
          # Release tags are annotated v* tags whose subject is "<Kind> build X.Y.Z (CODE)".
          code=$(git for-each-ref 'refs/tags/v*' --format='%(objecttype) %(contents:subject)' | sed -nE 's/^tag .* \(([0-9]+)\)$/\1/p' | sort -n | tail -1)
          echo "Highest released code: ${code:-none}"
          echo "code=${code:-0}" >> "$GITHUB_OUTPUT"

      - name: Apply CI manifests
        run: |
          cp Packages/manifest.ci.json Packages/manifest.json
          cp Packages/packages-lock.ci.json Packages/packages-lock.json

      # One source for the editor version: tests and build run in the same Android image.
      - name: Read Unity version
        run: |
          version=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)
          if [ -z "$version" ]; then echo "::error::No m_EditorVersion in ProjectSettings/ProjectVersion.txt"; exit 1; fi
          echo "Unity $version"
          echo "UNITY_VERSION=$version" >> "$GITHUB_ENV"

      # Restore the newest Library for this Unity version + packages. Only develop pushes save it
      # (see the end of this job), so PR runs don't fill the 10 GB cache limit and evict it.
      - name: Restore Unity Library
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/packages-lock.json') }}-${{ github.sha }}
          restore-keys: |
            Library-Android-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/packages-lock.json') }}-
            Library-Android-

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true   # the Unity image brings its own Android SDK
          dotnet: true
          haskell: true
          large-packages: false   # slowest step; the others free enough space
          docker-images: true

      # Rules and ball-flight unit tests (PingPong.Tests). Unity sometimes crashes while shutting down
      # after a successful run (exit 139), so this step may "fail"; the next step decides from the results.
      - name: Run EditMode tests
        id: tests
        continue-on-error: true
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          # Same image as the build: no second image pull, and no switch away from the Android
          # build target (the default Linux image re-imports ~2000 assets for StandaloneLinux64).
          customImage: unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-android-3
          # Coverage can't be switched off through this action version (its CLI rejects --no-coverageEnabled),
          # so keep it minimal: only our assemblies, no HTML, badge or extra-metric reports.
          coverageOptions: 'assemblyFilters:+PingPong.*'
          artifactsPath: test-results
          checkName: EditMode test results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      # Fails the job unless the results file exists, at least one test ran and none failed.
      - name: Check test results
        env:
          RESULTS: test-results/editmode-results.xml
          RUNNER_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          if [ ! -f "$RESULTS" ]; then
            echo "::error::No test results ($RESULTS); the test runner failed with: $RUNNER_OUTCOME"
            exit 1
          fi
          run=$(grep -m1 -o '<test-run [^>]*>' "$RESULTS")
          total=$(echo "$run" | sed -n 's/.* total="\([0-9]*\)".*/\1/p')
          failed=$(echo "$run" | sed -n 's/.* failed="\([0-9]*\)".*/\1/p')
          echo "EditMode tests: total=${total:-?} failed=${failed:-?} (runner step: $RUNNER_OUTCOME)"
          if [ -z "$total" ] || [ "$total" -eq 0 ] || [ "${failed:-1}" -ne 0 ]; then
            echo "::error::EditMode tests failed or did not run."
            exit 1
          fi
          if [ "$RUNNER_OUTCOME" != "success" ]; then
            echo "::warning::All tests passed, but Unity exited abnormally afterwards (known shutdown crash); continuing."
          fi

      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          # Check -> CheckBuild (version untouched); Develop/Staging/Production -> BuildDevelop/...
          buildMethod: PingPong.EditorTools.Build.BuildScript.${{ needs.plan.outputs.kind == 'Check' && 'CheckBuild' || format('Build{0}', needs.plan.outputs.kind) }}
          customParameters: ReleasedCode=${{ steps.released.outputs.code }}
          buildsPath: Builds/Android
          allowDirtyBuild: true
          androidKeystoreName: .keystore.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ping pong
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Read the built version
        id: built
        run: |
          version=$(sed -n 's/^  bundleVersion: //p' ProjectSettings/ProjectSettings.asset)
          code=$(sed -n 's/^  AndroidBundleVersionCode: //p' ProjectSettings/ProjectSettings.asset)
          echo "Built $version ($code)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Build${{ github.event_name == 'pull_request' && format('-PR-{0}', github.event.pull_request.number) || '' }}
          path: Builds/Android/*.apk
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
          if-no-files-found: error

      - name: Save Unity Library
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/packages-lock.json') }}-${{ github.sha }}

  release:
    name: Upload to Meta ALPHA
    needs: [plan, build]
    if: needs.plan.outputs.kind == 'Develop' || needs.plan.outputs.kind == 'Staging' || needs.plan.outputs.kind == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.build.outputs.version }}
      CODE: ${{ needs.build.outputs.code }}
      BRANCH: ${{ github.ref_name }}
    steps:
      # Checked first: without it the version can't be committed back.
      - name: Check the push token
        env:
          TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add a RELEASE_PUSH_TOKEN secret (a fine-grained token from an admin account, this repo only, Contents: read and write) so CI can commit the version back."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      # Saved before the upload, so a code is never uploaded without being recorded. Only the two version
      # lines are written, into the branch's current file, so other settings changed meanwhile are kept.
      - name: Commit the version back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pushed=0
          for _ in 1 2 3; do
            git pull --quiet --rebase origin "$BRANCH"
            sed -i -e "s/^  bundleVersion: .*/  bundleVersion: $VERSION/" \
                   -e "s/^  AndroidBundleVersionCode: .*/  AndroidBundleVersionCode: $CODE/" ProjectSettings/ProjectSettings.asset
            git add ProjectSettings/ProjectSettings.asset
            if git diff --cached --quiet; then echo "Version already committed."; pushed=1; break; fi
            git commit --quiet -m "Version $VERSION ($CODE) [skip ci]"
            if git push --quiet origin "HEAD:$BRANCH"; then pushed=1; break; fi
            git reset --quiet --hard "origin/$BRANCH"
          done
          if [ "$pushed" != 1 ]; then echo "::error::Could not commit version $VERSION ($CODE) to $BRANCH; not uploading."; exit 1; fi

      - name: Tag the release
        run: |
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            TAG="v$VERSION+$CODE" # the same name released again (e.g. main and develop): keep the code unique
          fi
          git tag -a "$TAG" -m "${{ needs.plan.outputs.kind }} build $VERSION ($CODE)"
          git push --quiet origin "$TAG"

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Unity-Build
          path: Builds/Android/

      - name: Setup ovr-platform-util
        uses: RageAgainstThePixel/setup-ovr-platform-util@v2

      - name: Upload to ALPHA
        uses: RageAgainstThePixel/upload-meta-quest-build@v2
        with:
          appId: ${{ secrets.META_APP_ID }}
          appSecret: ${{ secrets.META_APP_SECRET }}
          buildDir: 'Builds/Android/'
          releaseChannel: 'ALPHA'
          ageGroup: 'MIXED_AGES'
          draft: false
          releaseNotes: '${{ needs.plan.outputs.kind }} build ${{ needs.build.outputs.version }} (${{ needs.build.outputs.code }}) from ${{ github.ref_name }} @ ${{ github.sha }}'

  promote:
    name: Promote ALPHA to BETA
    needs: plan
    if: needs.plan.outputs.kind == 'Promote'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ovr-platform-util
        uses: RageAgainstThePixel/setup-ovr-platform-util@v2

      - name: Promote ALPHA to BETA
        run: |
          ovr-platform-util set-release-channel-build \
            --age-group MIXED_AGES \
            --app-id ${{ secrets.META_APP_ID }} \
            --app-secret ${{ secrets.META_APP_SECRET }} \
            --source-channel ALPHA \
            --destination-channel BETA

      - name: Tag the promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v$(sed -n 's/^  bundleVersion: //p' ProjectSettings/ProjectSettings.asset)-beta.${GITHUB_RUN_NUMBER}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; skipping."
          else
            git tag -a "$TAG" -m "Promoted to BETA: $TAG"
            git push --quiet origin "$TAG"
          fi
